<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ALLYRICH - 3D Interactive Hero</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100svh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000000;
    }
    #shopify-section-allyrich-3d-hero {
      width: 100vw;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
    }
    .allyrich-hero-page {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      background-color: #c2c1c0;
      background-image: url('/assets/allyrich-hero-bg.png');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #allyrich-spline-canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
      outline: none;
      cursor: grab;
      touch-action: none;
      background: transparent !important;
      background-color: transparent !important;
    }
    #allyrich-spline-canvas:active {
      cursor: grabbing;
    }
    .spline-loading-pulse {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      transition: opacity 0.4s ease;
      z-index: 5;
      pointer-events: none;
    }
    .spline-spinner {
      width: 36px;
      height: 36px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <section id="shopify-section-allyrich-3d-hero">
    <div id="allyrich-3d-hero-container" class="allyrich-hero-page">
      <canvas id="allyrich-spline-canvas"></canvas>
      <div id="spline-loader-indicator" class="spline-loading-pulse">
        <div class="spline-spinner"></div>
      </div>
    </div>
  </section>
  <script type="module" src="/assets/js/allyrich-3d-hero.js"></script>
</body>
</html>
